<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc"><title id="title">Flow CI dan deployment manual</title><desc id="desc">Pull request menjalankan CI pada GitHub-hosted runner. Kegagalan kembali ke perbaikan. Setelah lulus dan direview perubahan di-merge, operator menjalankan deployment pada self-hosted runner. Script berizin terbatas melakukan deployment, pemeriksaan, dan pencatatan hasil.</desc><defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#708399"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#087a77"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#2459bb"/></marker></defs><rect width="1200" height="1430" fill="#f7f9fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="156" fill="#ffffff"/><text x="48" y="40" font-size="17" fill="#2459bb" font-weight="700" text-anchor="start">SERVER &amp; DEVOPS   /   02 / 04</text><text x="48" y="91" font-size="36" fill="#152940" font-weight="700" text-anchor="start">Diperiksa otomatis. Dirilis terkontrol.</text><text x="48" y="130" font-size="21" fill="#53677c" font-weight="400" text-anchor="start">CI memeriksa perubahan; operator menentukan waktu deployment.</text><line x1="48" y1="155" x2="1152" y2="155" stroke="#d8e2ec" stroke-width="2"/><rect x="32" y="180" width="1136" height="468" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="64" y="216" font-size="17" fill="#53677c" font-weight="700" text-anchor="start">GITHUB / PEMERIKSAAN PERUBAHAN</text><path d="M600 316 L600 366" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M600 462 L600 504" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M510 552 L384 552" fill="none" stroke="#708399" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/><path d="M64 552 L46 552 L46 414 L400 414" fill="none" stroke="#708399" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-normal)"/><path d="M600 600 L600 690" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M600 782 L600 830" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="400" y="236" width="400" height="80" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="424" y="273" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Pull request dari fitur</text><rect x="400" y="366" width="400" height="96" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="424" y="403" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">GitHub-hosted CI</text><text x="424" y="434" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Validasi / build / smoke test</text><path d="M 600 504 L 690 552 L 600 600 L 510 552 Z" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="600" y="560" font-size="24" fill="#2459bb" font-weight="700" text-anchor="middle">Lulus?</text><rect x="64" y="504" width="320" height="96" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="541" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Perbaiki perubahan</text><text x="88" y="572" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Ulangi pemeriksaan</text><text x="446" y="538" font-size="18" fill="#53677c" font-weight="400" text-anchor="middle">Tidak</text><text x="624" y="632" font-size="18" fill="#2459bb" font-weight="400" text-anchor="start">Ya + review</text><rect x="400" y="690" width="400" height="92" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="424" y="727" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Merge ke main</text><text x="424" y="758" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Sumber deployment disepakati</text><rect x="400" y="830" width="400" height="96" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="424" y="867" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Run workflow</text><text x="424" y="898" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Persetujuan operator / manual</text><rect x="32" y="970" width="1136" height="356" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="432" y="1008" font-size="17" fill="#53677c" font-weight="700" text-anchor="start">PRODUKSI / KODE YANG DIPERCAYA</text><path d="M600 926 L600 952 L230 952 L230 1044" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M380 1098 L450 1098" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M750 1098 L820 1098" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M970 1152 L970 1180 L600 1180 L600 1208" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M970 1152 L970 1208" fill="none" stroke="#708399" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-normal)"/><rect x="80" y="1044" width="300" height="108" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="104" y="1081" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Self-hosted runner</text><text x="104" y="1112" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">User runner khusus</text><text x="104" y="1137" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Memanggil script</text><rect x="450" y="1044" width="300" height="108" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="474" y="1081" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Script deployment</text><text x="474" y="1112" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Sudo terbatas</text><text x="474" y="1137" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Build / recreate</text><rect x="820" y="1044" width="300" height="108" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="844" y="1081" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Verifikasi layanan</text><text x="844" y="1112" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Healthcheck</text><text x="844" y="1137" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Pemeriksaan publik</text><rect x="450" y="1208" width="300" height="86" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="474" y="1245" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Catat versi &amp; hasil</text><rect x="820" y="1208" width="300" height="86" rx="14" fill="#fff5df" stroke="#d8e2ec" stroke-width="2"/><text x="844" y="1245" font-size="25" fill="#995c12" font-weight="700" text-anchor="start">Gagal: evaluasi</text><text x="700" y="1169" font-size="18" fill="#087a77" font-weight="400" text-anchor="start">Lulus</text><text x="48" y="1368" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Migration database ditinjau pada deployment backend; rollback image bukan rollback database.</text><text x="48" y="1394" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Jalur putus: penanganan kegagalan memerlukan diagnosis, bukan klaim rollback otomatis.</text></g></svg>
