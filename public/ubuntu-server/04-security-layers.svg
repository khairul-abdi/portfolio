<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1378" viewBox="0 0 1200 1378" role="img" aria-labelledby="title desc"><title id="title">Lapisan keamanan dan penguatan yang belum diverifikasi</title><desc id="desc">Jalur publik menggunakan Cloudflare, trusted proxy, dan autentikasi aplikasi; jalur privat menggunakan Tailscale, SSH dan binding terbatas. Kontrol environment, runtime, dan backup tercatat. MFA, ACL granular, redaksi log, hak database, Docker socket dan isolasi masih memerlukan verifikasi.</desc><defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#708399"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#087a77"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#2459bb"/></marker></defs><rect width="1200" height="1378" fill="#f7f9fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="156" fill="#ffffff"/><text x="48" y="40" font-size="17" fill="#2459bb" font-weight="700" text-anchor="start">SERVER &amp; DEVOPS   /   04 / 04</text><text x="48" y="91" font-size="36" fill="#152940" font-weight="700" text-anchor="start">Keamanan berlapis. Batasnya tetap jelas.</text><text x="48" y="130" font-size="21" fill="#53677c" font-weight="400" text-anchor="start">Kontrol tercatat tidak berarti seluruh sistem telah diaudit.</text><line x1="48" y1="155" x2="1152" y2="155" stroke="#d8e2ec" stroke-width="2"/><text x="64" y="208" font-size="17" fill="#2459bb" font-weight="700" text-anchor="start">JALUR PUBLIK / DASHBOARD DAN API</text><text x="664" y="208" font-size="17" fill="#087a77" font-weight="700" text-anchor="start">JALUR PRIVAT / ADMINISTRASI</text><path d="M300 334 L300 390" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M300 498 L300 554" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M900 334 L900 390" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M900 498 L900 554" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="64" y="238" width="472" height="96" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="275" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Cloudflare + tunnel</text><text x="88" y="306" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">HTTPS publik / tunnel terenkripsi</text><rect x="64" y="390" width="472" height="108" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="427" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Nginx dan trusted proxy</text><text x="88" y="458" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Skema HTTPS diteruskan ke aplikasi</text><text x="88" y="483" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Hop lokal tidak otomatis memakai TLS</text><rect x="64" y="554" width="472" height="108" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="591" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Autentikasi aplikasi</text><text x="88" y="622" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Role Filament / token API</text><text x="88" y="647" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Cookie sesi beratribut keamanan</text><rect x="664" y="238" width="472" height="96" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="275" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Tailscale</text><text x="688" y="306" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Akses melalui perangkat berizin</text><rect x="664" y="390" width="472" height="108" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="427" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">SSH dan layanan privat</text><text x="688" y="458" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">UFW / binding loopback</text><text x="688" y="483" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">PostgreSQL dan Kuma tidak publik</text><rect x="664" y="554" width="472" height="108" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="591" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Kontrol operator</text><text x="688" y="622" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Izin sudo pada script tertentu</text><text x="688" y="647" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">CI PR terpisah dari runner produksi</text><rect x="48" y="750" width="1104" height="258" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="72" y="790" font-size="17" fill="#53677c" font-weight="700" text-anchor="start">KONTROL LINTAS LAYANAN YANG TERCATAT</text><rect x="72" y="824" width="320" height="138" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="96" y="861" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Konfigurasi rahasia</text><text x="96" y="892" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">File env berizin terbatas</text><text x="96" y="917" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Tidak dimasukkan Git</text><text x="96" y="942" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">BuildKit secret</text><rect x="440" y="824" width="320" height="138" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="464" y="861" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Runtime &amp; update</text><text x="464" y="892" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Frontend non-root</text><text x="464" y="917" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Pencatatan versi image</text><text x="464" y="942" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Pembaruan terkontrol</text><rect x="808" y="824" width="320" height="138" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="832" y="861" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Data &amp; pemulihan</text><text x="832" y="892" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Permission backup</text><text x="832" y="917" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Storage persisten</text><text x="832" y="942" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Uji restore terpisah</text><rect x="48" y="1080" width="1104" height="174" rx="14" fill="#fff5df" stroke="#d8e2ec" stroke-width="2" stroke-dasharray="8 6"/><text x="72" y="1120" font-size="19" fill="#995c12" font-weight="700" text-anchor="start">PERLU VERIFIKASI / PENGUATAN LANJUTAN</text><text x="72" y="1160" font-size="22" fill="#152940" font-weight="400" text-anchor="start">MFA dan ACL granular · redaksi log · hak database · Docker socket</text><text x="72" y="1194" font-size="22" fill="#152940" font-weight="400" text-anchor="start">Audit dependency · isolasi antaraplikasi · pemulihan lengkap</text><text x="72" y="1227" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Tidak diklaim sebagai kontrol yang seluruhnya sudah diterapkan.</text><text x="48" y="1310" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Tidak ada klaim bebas celah, isolasi multi-tenant, TLS di semua hop, atau audit keamanan formal.</text><text x="48" y="1336" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Status kontrol dijelaskan lebih rinci pada matriks security di dalam artikel.</text></g></svg>
