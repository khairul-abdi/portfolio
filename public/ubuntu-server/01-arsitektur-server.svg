<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" role="img" aria-labelledby="title desc"><title id="title">Arsitektur server publik dan privat</title><desc id="desc">Cloudflare dan cloudflared mengantarkan request ke Nginx lalu tiga aplikasi. Tailscale memberi akses privat ke SSH, Uptime Kuma, dan PostgreSQL. Frontend Masjid memanggil backend; backend memakai PostgreSQL.</desc><defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#708399"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#087a77"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#2459bb"/></marker></defs><rect width="1200" height="1330" fill="#f7f9fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="156" fill="#ffffff"/><text x="48" y="40" font-size="17" fill="#2459bb" font-weight="700" text-anchor="start">SERVER &amp; DEVOPS   /   01 / 04</text><text x="48" y="91" font-size="36" fill="#152940" font-weight="700" text-anchor="start">Satu server. Dua jalur akses.</text><text x="48" y="130" font-size="21" fill="#53677c" font-weight="400" text-anchor="start">Website melalui Cloudflare; administrasi melalui Tailscale.</text><line x1="48" y1="155" x2="1152" y2="155" stroke="#d8e2ec" stroke-width="2"/><rect x="32" y="510" width="1136" height="714" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="432" y="546" font-size="17" fill="#53677c" font-weight="700" text-anchor="start">UBUNTU SERVER / DOCKER COMPOSE</text><path d="M314 290 L314 350" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M314 444 L314 494 L220 494 L220 570" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M220 666 L220 710" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M220 806 L220 858 L220 858 L220 902" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M220 806 L220 858 L576 858 L576 902" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M220 806 L220 858 L952 858 L952 902" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M732 950 L776 950" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M952 1006 L952 1080" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M900 290 L900 350" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M900 444 L900 486 L1150 486 L1150 618 L1128 618" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M900 444 L900 486 L1150 486 L1150 758 L1128 758" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M900 444 L900 486 L1150 486 L1150 1128 L1128 1128" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="64" y="194" width="500" height="96" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="231" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Pengunjung website</text><text x="88" y="262" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Domain publik / HTTPS</text><rect x="664" y="194" width="472" height="96" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="231" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Administrator</text><text x="688" y="262" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Perangkat pada jaringan privat</text><rect x="64" y="350" width="500" height="94" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="387" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Cloudflare</text><text x="88" y="418" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">DNS dan endpoint HTTPS</text><rect x="664" y="350" width="472" height="94" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="387" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Tailscale</text><text x="688" y="418" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Identitas dan akses tailnet</text><rect x="64" y="570" width="312" height="96" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="607" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">cloudflared</text><text x="88" y="638" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Tunnel dari server</text><rect x="64" y="710" width="312" height="96" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="747" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Nginx</text><text x="88" y="778" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Routing per hostname</text><rect x="830" y="570" width="298" height="96" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="854" y="607" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">SSH</text><text x="854" y="638" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Administrasi host</text><rect x="830" y="710" width="298" height="96" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="854" y="747" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Uptime Kuma</text><text x="854" y="778" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Dashboard privat</text><rect x="64" y="902" width="312" height="104" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="939" font-size="25" fill="#152940" font-weight="700" text-anchor="start">GreetingCard</text><text x="88" y="970" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Next.js / website publik</text><rect x="420" y="902" width="312" height="104" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="444" y="939" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Masjid Frontend</text><text x="444" y="970" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Next.js / API internal</text><rect x="776" y="902" width="352" height="104" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="800" y="939" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Masjid Backend</text><text x="800" y="970" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Laravel / Filament / API</text><rect x="776" y="1080" width="352" height="96" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="800" y="1117" font-size="25" fill="#152940" font-weight="700" text-anchor="start">PostgreSQL</text><text x="800" y="1148" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Volume aktif di SSD</text><text x="398" y="934" font-size="17" fill="#53677c" font-weight="700" text-anchor="start"></text><text x="64" y="1122" font-size="21" fill="#53677c" font-weight="400" text-anchor="start">Antaraplikasi: jaringan Docker internal.</text><text x="64" y="1152" font-size="21" fill="#53677c" font-weight="400" text-anchor="start">Upload dan backup: HDD terpisah.</text><text x="48" y="1266" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Panah menunjukkan jalur request/akses. Tunnel dibentuk dari server ke Cloudflare.</text><text x="48" y="1292" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Open WebUI adalah eksperimen historis, bukan layanan aktif pada baseline ini.</text></g></svg>
