<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1378" viewBox="0 0 1200 1378" role="img" aria-labelledby="title desc"><title id="title">Alur backup dan uji restore PostgreSQL</title><desc id="desc">Timer menjalankan dump PostgreSQL ke HDD. Checksum dan restore terpisah memeriksa aspek berbeda. Restore Masjid dijalankan pada container serta direktori terpisah dan diverifikasi melalui query; backup satu host tidak melindungi kehilangan seluruh mesin.</desc><defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#708399"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#087a77"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#2459bb"/></marker></defs><rect width="1200" height="1378" fill="#f7f9fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="156" fill="#ffffff"/><text x="48" y="40" font-size="17" fill="#2459bb" font-weight="700" text-anchor="start">SERVER &amp; DEVOPS   /   03 / 04</text><text x="48" y="91" font-size="36" fill="#152940" font-weight="700" text-anchor="start">Backup dibuat. Restore dibuktikan.</text><text x="48" y="130" font-size="21" fill="#53677c" font-weight="400" text-anchor="start">Produksi dan lingkungan pemulihan memiliki target data terpisah.</text><line x1="48" y1="155" x2="1152" y2="155" stroke="#d8e2ec" stroke-width="2"/><path d="M300 316 L300 356 L600 356 L600 400" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M900 316 L900 356 L600 356 L600 400" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M600 504 L600 566" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M600 680 L600 728 L300 728 L300 790" fill="none" stroke="#2459bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M600 680 L600 728 L900 728 L900 790" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M900 910 L900 978" fill="none" stroke="#087a77" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="64" y="208" width="472" height="108" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="245" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">PostgreSQL produksi</text><text x="88" y="276" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Volume aktif pada SSD</text><text x="88" y="301" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Sumber data backup</text><rect x="664" y="208" width="472" height="108" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="245" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Timer systemd</text><text x="688" y="276" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Jadwal backup teratur</text><text x="688" y="301" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Menjalankan service backup</text><rect x="360" y="400" width="480" height="104" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="384" y="437" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Proses dump</text><text x="384" y="468" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Seluruh cluster + database Masjid</text><rect x="360" y="566" width="480" height="114" rx="14" fill="#edf3ff" stroke="#d8e2ec" stroke-width="2"/><text x="384" y="603" font-size="25" fill="#2459bb" font-weight="700" text-anchor="start">Backup pada HDD</text><text x="384" y="634" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">SQL.gz / custom dump / checksum</text><text x="384" y="659" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Retensi awal: 30 hari</text><rect x="64" y="790" width="472" height="120" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="88" y="827" font-size="25" fill="#152940" font-weight="700" text-anchor="start">Pemeriksaan checksum</text><text x="88" y="858" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">File sesuai checksum yang dicatat</text><text x="88" y="883" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Bukan pengganti uji restore</text><rect x="664" y="790" width="472" height="120" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="827" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Restore pengujian</text><text x="688" y="858" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Container dan direktori terpisah</text><text x="688" y="883" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Tidak menimpa database produksi</text><rect x="664" y="978" width="472" height="104" rx="14" fill="#e8f6f3" stroke="#d8e2ec" stroke-width="2"/><text x="688" y="1015" font-size="25" fill="#087a77" font-weight="700" text-anchor="start">Validasi hasil restore</text><text x="688" y="1046" font-size="20" fill="#53677c" font-weight="400" text-anchor="start">Query tabel dan data berhasil</text><text x="64" y="1016" font-size="22" fill="#53677c" font-weight="400" text-anchor="start">Backup database tidak otomatis</text><text x="64" y="1048" font-size="22" fill="#53677c" font-weight="400" text-anchor="start">mencakup file upload aplikasi.</text><rect x="48" y="1150" width="1104" height="114" rx="14" fill="#fff5df" stroke="#d8e2ec" stroke-width="2"/><text x="72" y="1190" font-size="19" fill="#995c12" font-weight="700" text-anchor="start">BATAS PERLINDUNGAN</text><text x="72" y="1227" font-size="21" fill="#152940" font-weight="400" text-anchor="start">HDD masih berada pada host yang sama: bukan disaster recovery lintas lokasi.</text><text x="48" y="1310" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Hasil yang tercatat: restore database Masjid dan query tabel berhasil.</text><text x="48" y="1336" font-size="18" fill="#53677c" font-weight="400" text-anchor="start">Pemulihan seluruh aplikasi, role, konfigurasi, dan upload masih perlu pengujian terpisah.</text></g></svg>
